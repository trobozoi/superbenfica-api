      description: Somente ADMIN.
      summary: Cadastrar filial
      tags:
      - Filiais
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LojaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LojaRequest'
          multipart/form-data:
            schema:
