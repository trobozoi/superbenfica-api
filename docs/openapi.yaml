      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEstoqueLocalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEstoqueLocalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEstoqueLocalRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstoqueLocal'
