openapi: 3.0.3
info:
  title: Super Benfica API
  version: 1.0.0
  description: |-
    API REST do sistema de gerenciamento de supermercados **Super Benfica**.

    ### Autenticação
    1. Obtenha um par de tokens em `POST /api/auth/token/` com e-mail e senha.
    2. Clique em **Authorize** e informe o token de acesso (`access`).
    3. Renove o token expirado em `POST /api/auth/token/refresh/`.

    ### Perfis (roles)
    | Role | Acesso |
    |------|--------|
    | ADMIN | Tudo, em todas as filiais |
    | GERENTE | Gestão completa da própria filial e relatórios |
    | SEPARADOR | Consulta de estoque e separação de pedidos da filial |
    | CAIXA | Consulta de estoque, clientes e criação de pedidos da filial |
    | CLIENTE | Catálogo e os próprios pedidos e endereços |

    ### Tempo real
    Eventos de pedidos e estoque são publicados no WebSocket `ws(s)://<host>/ws/lojas/<loja_id>/?token=<access>`.
paths:
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Invalida o ``refresh`` informado (blacklist).
      summary: Logout
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklistRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/auth/registrar/:
    post:
      operationId: auth_registrar_create
      description: 'Cadastro público: cria um usuário com role CLIENTE e o respectivo
        cliente.'
      summary: Cadastro de cliente
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroClienteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegistroClienteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegistroClienteRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: Recebe e-mail e senha e retorna os tokens ``access`` e ``refresh``.
      summary: Obter tokens JWT
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenComPerfilRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenComPerfilRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenComPerfilRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: Troca um ``refresh`` válido por um novo ``access`` (com rotação).
      summary: Renovar token de acesso
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefreshRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/auth/token/verify/:
    post:
      operationId: auth_token_verify_create
      description: Indica se um token ainda é válido.
      summary: Validar token
      tags:
      - Autenticação
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenVerifyRequest'
        required: true
      responses:
        '200':
          description: No response body
  /api/clientes/:
    get:
      operationId: clientes_list
      description: Funcionários veem todos; o CLIENTE vê apenas o próprio cadastro.
      summary: Listar clientes
      parameters:
      - in: query
        name: loja
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - Clientes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedClienteList'
          description: ''
    post:
      operationId: clientes_create
      description: ADMIN, GERENTE e CAIXA. Para autocadastro use ``/api/auth/registrar/``.
      summary: Cadastrar cliente (balcão)
      tags:
      - Clientes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
          description: ''
  /api/clientes/{id}/:
    get:
      operationId: clientes_retrieve
      description: Cadastro de clientes.
      summary: Detalhar cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este cliente.
        required: true
      tags:
      - Clientes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
          description: ''
    put:
      operationId: clientes_update
      description: Cadastro de clientes.
      summary: Atualizar cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este cliente.
        required: true
      tags:
      - Clientes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ClienteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
          description: ''
    patch:
      operationId: clientes_partial_update
      description: Cadastro de clientes.
      summary: Atualizar parcialmente cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este cliente.
        required: true
      tags:
      - Clientes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedClienteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedClienteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedClienteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cliente'
          description: ''
    delete:
      operationId: clientes_destroy
      description: ADMIN e GERENTE.
      summary: Excluir cliente
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este cliente.
        required: true
      tags:
      - Clientes
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/enderecos/:
    get:
      operationId: enderecos_list
      description: 'Filtro: ``cliente``.'
      summary: Listar endereços
      parameters:
      - in: query
        name: cidade
        schema:
          type: string
      - in: query
        name: cliente
        schema:
          type: integer
      - in: query
        name: estado
        schema:
          type: string
          enum:
          - AC
          - AL
          - AM
          - AP
          - BA
          - CE
          - DF
          - ES
          - GO
          - MA
          - MG
          - MS
          - MT
          - PA
          - PB
          - PE
          - PI
          - PR
          - RJ
          - RN
          - RO
          - RR
          - RS
          - SC
          - SE
          - SP
          - TO
        description: |-
          * `AC` - Acre
          * `AL` - Alagoas
          * `AP` - Amapá
          * `AM` - Amazonas
          * `BA` - Bahia
          * `CE` - Ceará
          * `DF` - Distrito Federal
          * `ES` - Espírito Santo
          * `GO` - Goiás
          * `MA` - Maranhão
          * `MT` - Mato Grosso
          * `MS` - Mato Grosso do Sul
          * `MG` - Minas Gerais
          * `PA` - Pará
          * `PB` - Paraíba
          * `PR` - Paraná
          * `PE` - Pernambuco
          * `PI` - Piauí
          * `RJ` - Rio de Janeiro
          * `RN` - Rio Grande do Norte
          * `RS` - Rio Grande do Sul
          * `RO` - Rondônia
          * `RR` - Roraima
          * `SC` - Santa Catarina
          * `SP` - São Paulo
          * `SE` - Sergipe
          * `TO` - Tocantins
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: principal
        schema:
          type: boolean
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - Clientes
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEnderecoClienteList'
          description: ''
    post:
      operationId: enderecos_create
      description: Endereços de entrega dos clientes.
      summary: Cadastrar endereço
      tags:
      - Clientes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnderecoClienteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnderecoClienteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnderecoClienteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnderecoCliente'
          description: ''
  /api/enderecos/{id}/:
    get:
      operationId: enderecos_retrieve
