components:
  schemas:
    AjusteEstoqueRequest:
      type: object
      description: Entrada (positivo) ou saída (negativo) manual de mercadoria.
      properties:
        delta:
          type: integer
          description: Quantidade a somar (ou subtrair, se negativa).
        motivo:
          type: string
          minLength: 1
          description: 'Ex.: recebimento de fornecedor, perda, inventário.'
          maxLength: 255
      required:
      - delta
      - motivo
    CategoriaEnum:
      enum:
      - HORTIFRUTI
      - MERCEARIA
      - BEBIDAS
      - LATICINIOS
      - PADARIA
      - ACOUGUE
      - LIMPEZA
      - HIGIENE
      type: string
      description: |-
        * `HORTIFRUTI` - Hortifrúti
        * `MERCEARIA` - Mercearia
        * `BEBIDAS` - Bebidas
        * `LATICINIOS` - Laticínios e frios
        * `PADARIA` - Padaria
        * `ACOUGUE` - Açougue
        * `LIMPEZA` - Limpeza
        * `HIGIENE` - Higiene e beleza
    Cliente:
      type: object
      description: Cliente com a lista (somente leitura) dos seus endereços.
      properties:
        id:
          type: integer
          readOnly: true
        usuario:
          type: integer
          readOnly: true
