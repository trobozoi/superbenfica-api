      tags:
      - Filiais
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LojaRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LojaRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LojaRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loja'
          description: ''
    patch:
      operationId: lojas_partial_update
      description: CRUD de filiais. Escrita restrita a administradores.
      summary: Atualizar parcialmente filial
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este loja.
        required: true
      tags:
      - Filiais
      requestBody:
