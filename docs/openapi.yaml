        required: true
      tags:
      - Estoque
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AjusteEstoqueRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AjusteEstoqueRequest'
          multipart/form-data:
            schema:
