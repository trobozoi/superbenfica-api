          application/json:
            schema:
              $ref: '#/components/schemas/EstoqueLocalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EstoqueLocalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EstoqueLocalRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
