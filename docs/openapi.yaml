          application/json:
            schema:
              $ref: '#/components/schemas/EnderecoClienteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EnderecoClienteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EnderecoClienteRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnderecoCliente'
          description: ''
    patch:
      operationId: enderecos_partial_update
      description: Endereços de entrega dos clientes.
      summary: Atualizar parcialmente endereço
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este endereço do cliente.
        required: true
      tags:
      - Clientes
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEnderecoClienteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEnderecoClienteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEnderecoClienteRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnderecoCliente'
          description: ''
    delete:
      operationId: enderecos_destroy
      description: Endereços de entrega dos clientes.
      summary: Excluir endereço
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este endereço do cliente.
        required: true
      tags:
      - Clientes
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/estoques/:
    get:
      operationId: estoques_list
      description: Funcionários veem o estoque da própria filial; ADMIN vê todas.
        Use ``abaixo_do_minimo=true`` para listar itens a repor.
      summary: Listar estoque
      parameters:
      - in: query
        name: abaixo_do_minimo
        schema:
          type: string
        description: Somente saldos abaixo do mínimo
      - in: query
        name: loja
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Qual campo usar ao ordenar os resultados.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: Um número de página dentro do conjunto de resultados paginado.
        schema:
          type: integer
      - in: query
        name: produto
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: Um termo de busca.
        schema:
          type: string
      tags:
      - Estoque
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedEstoqueLocalList'
          description: ''
    post:
      operationId: estoques_create
      description: ADMIN e GERENTE.
      summary: Cadastrar produto no estoque da filial
      tags:
      - Estoque
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstoqueLocalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EstoqueLocalRequest'
          multipart/form-data:
            schema:
