        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este estoque local.
        required: true
      tags:
      - Estoque
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/estoques/{id}/ajustar/:
    post:
      operationId: estoques_ajustar_create
      description: Entrada (``delta`` positivo) ou saída (``delta`` negativo) manual.
        Retorna 409 se o saldo ficaria negativo. Publica ``estoque.atualizado`` no
        WebSocket.
      summary: Ajustar saldo
      parameters:
      - in: path
        name: id
        schema:
          type: integer
