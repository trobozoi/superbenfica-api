                $ref: '#/components/schemas/Loja'
          description: ''
  /api/lojas/{id}/:
    get:
      operationId: lojas_retrieve
      description: CRUD de filiais. Escrita restrita a administradores.
      summary: Detalhar filial
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este loja.
        required: true
      tags:
      - Filiais
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Loja'
          description: ''
    put:
      operationId: lojas_update
      description: Somente ADMIN.
      summary: Atualizar filial
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: Um valor inteiro único que identifica este loja.
