# Configuração do SonarScanner para o Super Benfica API (SonarQube Cloud).
# O token (SONAR_TOKEN) vem do secret do GitHub Actions.
# Organização e chave seguem o padrão do SonarQube Cloud ao importar o repositório do GitHub.

sonar.organization=trobozoi
sonar.projectKey=trobozoi_superbenfica-api
sonar.projectName=Super Benfica API
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

sonar.sources=apps,config
sonar.tests=tests
sonar.python.version=3.12,3.13

# Relatório gerado por: pytest (ver [tool.pytest.ini_options] no pyproject.toml)
sonar.python.coverage.reportPaths=coverage.xml

# Fora da análise: código gerado, dados de exemplo e settings específicos de ambiente.
sonar.exclusions=**/migrations/**,**/seed_data/**,config/settings/test.py,config/settings/dev.py,staticfiles/**,.venv/**
sonar.coverage.exclusions=**/migrations/**,config/settings/**,config/wsgi.py,manage.py
