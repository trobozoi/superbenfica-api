# Proxy reverso do Super Benfica (desenvolvimento).
# Em produção, adicione "listen 443 ssl" com certificado e redirecione a porta 80 para HTTPS.

upstream superbenfica_api {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 5m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # WebSocket (Django Channels)
    location /ws/ {
        proxy_pass http://superbenfica_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # API REST, admin e documentação
    location / {
        proxy_pass http://superbenfica_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
